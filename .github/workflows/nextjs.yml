name: Validate Next.js

on:
  push:
    branches: ["master"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run regression checks
        run: |
          npm run test:chat
          npx tsc --noEmit
          npm run lint
